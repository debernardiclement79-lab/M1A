<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M1A · Inference</title><link rel="stylesheet" href="/style.css"></head><body>
<dialog id="login"><form id="login-form"><h2>M1A / Connexion</h2><input id="username" autocomplete="username" placeholder="Utilisateur" required aria-label="Utilisateur"><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required aria-label="Mot de passe"><button>Connexion</button><p id="login-error" role="alert"></p><small>Réinitialisation uniquement sur le serveur, en local.</small></form></dialog><dialog id="key-dialog"><h2>Clés API</h2><div id="key-list"></div><button id="create-key">Générer une clé</button><pre id="key-token"></pre><button id="close-keys">Fermer</button></dialog><aside><a class="brand" href="/">M1A<span> / INFERENCE</span></a><button id="new">+ Nouvelle conversation</button><div class="label">ARCHIVES DE SESSION</div><nav id="conversations"></nav><button id="keys">Clés API</button><button id="logout">Déconnexion</button><footer><span class="dot"></span><span id="sync">Connexion…</span><small>WEB ↔ DESKTOP · SYNC</small></footer></aside>
<main><header><div><span class="label">ESPACE DE TRAVAIL /</span> <strong id="title">Terminal de discussion</strong></div><select aria-label="Mode de discussion"><option>Discussion</option><option disabled>Agent · bientôt</option><option disabled>Recherche · bientôt</option><option disabled>Code · bientôt</option></select></header>
<section id="messages" aria-live="polite"></section><div class="composer"><div id="attachments"></div><form id="form"><label class="attach" title="Joindre des documents textuels">+<input id="files" type="file" multiple accept=".txt,.md,.csv,.json,.log,.js,.py,.html,.css"></label><textarea id="input" aria-label="Votre message" placeholder="Écrivez votre message…" rows="2" maxlength="20000"></textarea><button id="send" type="submit">Envoyer ↗</button></form><div class="hint"><span id="model">Chargement…</span><span>ENTRÉE pour envoyer · MAJ + ENTRÉE pour une ligne</span></div><p id="error" role="alert"></p></div></main><script type="module" src="/app.js"></script></body></html>
